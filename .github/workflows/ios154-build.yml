name: iOS 15.4 Backport Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: |
          brew install ninja llvm libarchive pkg-config meson
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
      - run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Patch iSH VDSO (skip lld, use stub)
        run: |
          # lld is unavailable on this runner; patch meson to use the VDSO stub
          # (the build already supports a no-VDSO fallback, we force it)
          MESON_FILE="deps/ish/vdso/arm64/meson.build"
          if [ -f "$MESON_FILE" ]; then
            # Comment out the real VDSO block, keep the stub fallback
            # Simplest: make clang 'not found' by pointing to a nonexistent path
            sed -i.bak "s|find_program('/usr/local/opt/llvm/bin/clang'|find_program('/nonexistent/clang', '/usr/local/opt/llvm/bin/clang'|" "$MESON_FILE"
            echo "patched $MESON_FILE"
            grep -n "find_program" "$MESON_FILE" | head -3
          fi
      - run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig || true
      - run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
      - run: |
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
      - run: ./deps/build_rclone_ios.sh
      - run: |
          cd src/ios
          xcodebuild -project Minis.xcodeproj -scheme Minis -configuration Release \
            -sdk iphoneos -derivedDataPath ../../build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - run: |
          APP_PATH=$(find build/derived/Build/Products/Release-iphoneos -name "Minis.app" -maxdepth 1)
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -qr Minis-iOS154.ipa Payload && cd ../..
          ls -lh build/ipa/Minis-iOS154.ipa
          shasum -a 256 build/ipa/Minis-iOS154.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS154
          path: build/ipa/Minis-iOS154.ipa
