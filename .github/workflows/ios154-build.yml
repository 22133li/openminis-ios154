name: iOS 15.4 Backport Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: |
          brew install ninja llvm libarchive pkg-config meson
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
      - run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Fix LLVM lld linker for iSH VDSO
        run: |
          LLVM_BIN="$(brew --prefix llvm)/bin"
          echo "LLVM bin: $LLVM_BIN"
          ls "$LLVM_BIN" | grep -i lld || echo "no lld binaries found"
          # clang -fuse-ld=lld looks for ld.lld next to clang; ensure it exists
          if [ ! -e "$LLVM_BIN/ld.lld" ]; then
            # Try common locations
            for cand in /opt/homebrew/bin/ld.lld /usr/local/bin/ld.lld; do
              if [ -e "$cand" ]; then ln -sf "$cand" "$LLVM_BIN/ld.lld"; echo "linked $cand"; break; fi
            done
          fi
          ls -la "$LLVM_BIN/ld.lld" || echo "STILL MISSING ld.lld"
          # Also ensure lld is on PATH as fallback
          echo "$LLVM_BIN" >> $GITHUB_PATH
      - run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig || true
      - run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
      - run: |
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
      - run: ./deps/build_rclone_ios.sh
      - run: |
          cd src/ios
          xcodebuild -project Minis.xcodeproj -scheme Minis -configuration Release \
            -sdk iphoneos -derivedDataPath ../../build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - run: |
          APP_PATH=$(find build/derived/Build/Products/Release-iphoneos -name "Minis.app" -maxdepth 1)
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -qr Minis-iOS154.ipa Payload && cd ../..
          ls -lh build/ipa/Minis-iOS154.ipa
          shasum -a 256 build/ipa/Minis-iOS154.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS154
          path: build/ipa/Minis-iOS154.ipa
